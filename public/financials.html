<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Financials · Kaghazi CRM</title>
<link rel="stylesheet" href="/css/style.css" />
</head>
<body data-page="financials">
  <div class="shell">
    <nav class="sidebar" id="sidebar-mount"></nav>
    <main class="main">
      <div class="topbar">
        <div><h1>Financials</h1><div class="sub">Commissions, expenses & token money held</div></div>
        <button class="btn-ledger" onclick="openCreate()">+ New Entry</button>
      </div>

      <div class="stat-grid" style="grid-template-columns: repeat(3, 1fr);">
        <div class="stat-card"><div class="label">Total Income</div><div class="value" id="stat-income">—</div></div>
        <div class="stat-card"><div class="label">Total Expenses</div><div class="value rust" id="stat-expense">—</div></div>
        <div class="stat-card"><div class="label">Token Money Held</div><div class="value" id="stat-held">—</div></div>
      </div>

      <div class="table-wrap">
        <table class="data-table">
          <thead><tr><th>Date</th><th>Type</th><th>Category</th><th>Description</th><th style="text-align:right;">Amount</th><th></th></tr></thead>
          <tbody id="rows"><tr><td colspan="6" class="empty-state">Loading…</td></tr></tbody>
        </table>
      </div>
    </main>
  </div>

  <div class="modal-backdrop-custom" id="modal">
    <div class="modal-box">
      <div class="modal-head"><h3>New Financial Entry</h3><button class="close-x" onclick="closeModal('modal')">✕</button></div>
      <div class="modal-body">
        <form id="form" class="form-grid">
          <div class="field"><label>Entry type *</label>
            <select id="f-entry_type" required><option value="income">Income</option><option value="expense">Expense</option><option value="token_held">Token Held</option></select>
          </div>
          <div class="field"><label>Category</label>
            <select id="f-category"><option value="commission">Commission</option><option value="marketing">Marketing</option><option value="fuel">Fuel</option><option value="other">Other</option></select>
          </div>
          <div class="field"><label>Amount (PKR) *</label><input id="f-amount" type="number" required /></div>
          <div class="field"><label>Date</label><input id="f-entry_date" type="date" /></div>
          <div class="field"><label>Related deal</label><select id="f-deal_id"><option value="">—</option></select></div>
          <div class="field span-2"><label>Description</label><input id="f-description" /></div>
        </form>
      </div>
      <div class="modal-foot">
        <button class="btn-ghost" onclick="closeModal('modal')">Cancel</button>
        <button class="btn-ledger" onclick="saveEntry()">Save Entry</button>
      </div>
    </div>
  </div>

<script src="/js/common.js"></script>
<script src="/js/layout.js"></script>
<script>
let ENTRIES = [], DEALS = [];

async function load() {
  try {
    [ENTRIES, DEALS] = await Promise.all([apiGet("/financials"), apiGet("/deals")]);
    document.getElementById("f-deal_id").innerHTML = `<option value="">—</option>` + DEALS.map((d) => `<option value="${d.id}">Deal (${titleCase(d.stage)})</option>`).join("");
    renderStats();
    renderTable();
  } catch (err) { toast(err.message, true); }
}

function renderStats() {
  const income = ENTRIES.filter((e) => e.entry_type === "income").reduce((s, e) => s + Number(e.amount), 0);
  const expense = ENTRIES.filter((e) => e.entry_type === "expense").reduce((s, e) => s + Number(e.amount), 0);
  const held = ENTRIES.filter((e) => e.entry_type === "token_held").reduce((s, e) => s + Number(e.amount), 0);
  document.getElementById("stat-income").textContent = fmtPKR(income);
  document.getElementById("stat-expense").textContent = fmtPKR(expense);
  document.getElementById("stat-held").textContent = fmtPKR(held);
}

const TYPE_PILL = { income: "", expense: "rust", token_held: "gold" };

function renderTable() {
  document.getElementById("rows").innerHTML = ENTRIES.length
    ? ENTRIES.map((e) => `
      <tr>
        <td>${fmtDate(e.entry_date)}</td>
        <td><span class="pill ${TYPE_PILL[e.entry_type] || ""}">${titleCase(e.entry_type)}</span></td>
        <td>${titleCase(e.category)}</td>
        <td class="muted">${escapeHtml(e.description || "—")}</td>
        <td style="text-align:right; font-family:var(--font-mono);">${fmtPKR(e.amount)}</td>
        <td style="text-align:right;"><button class="btn-danger-ghost" onclick="removeEntry('${e.id}')">Delete</button></td>
      </tr>`).join("")
    : `<tr><td colspan="6" class="empty-state">No entries yet. Log commissions and expenses as they happen.</td></tr>`;
}

function openCreate() {
  document.getElementById("form").reset();
  document.getElementById("f-entry_date").value = new Date().toISOString().slice(0,10);
  openModal("modal");
}

async function saveEntry() {
  const payload = {
    entry_type: document.getElementById("f-entry_type").value,
    category: document.getElementById("f-category").value,
    amount: document.getElementById("f-amount").value,
    entry_date: document.getElementById("f-entry_date").value || null,
    deal_id: document.getElementById("f-deal_id").value || null,
    description: document.getElementById("f-description").value || null,
  };
  if (!payload.amount) { toast("Amount is required", true); return; }
  try {
    await apiPost("/financials", payload);
    closeModal("modal");
    toast("Entry saved");
    load();
  } catch (err) { toast(err.message, true); }
}

async function removeEntry(id) {
  if (!(await confirmDelete("entry"))) return;
  try { await apiDelete(`/financials/${id}`); toast("Entry deleted"); load(); }
  catch (err) { toast(err.message, true); }
}

load();
</script>
</body>
</html>
